<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PickupQR – Order ahead, show the code, collect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#14213d;--mu:#5f6b85;--bd:#dbe1ec;--ac:#1e2a78;--act:#fff;--hi:#f5a524;--ok:#15803d;--bad:#b91c1c;--chip:#e3e8f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--tx:#eef1f9;--mu:#98a4c2;--bd:#2a3556;--ac:#f5a524;--act:#1a1203;--ok:#4ade80;--bad:#f87171;--chip:#222d4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--tx:#eef1f9;--mu:#98a4c2;--bd:#2a3556;--ac:#f5a524;--act:#1a1203;--ok:#4ade80;--bad:#f87171;--chip:#222d4d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:-.03em}
nav{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px}
nav button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;font-size:14px;padding:6px 12px;border-radius:9px;cursor:pointer}
nav .on{background:var(--ac);color:var(--act)}
main{max-width:560px;margin:0 auto;padding:14px 14px 110px}
h2{font-size:26px;letter-spacing:-.03em;margin:6px 0 12px}h3{margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 10px;color:inherit;font:inherit;text-align:left;width:100%}
.pr{display:flex;flex-direction:column;gap:3px;margin:0}.pr.off{opacity:.5}
.em{font-size:36px;line-height:1.1}
.btn{background:var(--ac);color:var(--act);border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;width:100%;cursor:pointer}
.btn.sm{padding:8px 12px;width:auto;font-size:14px}.btn.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--chip);color:var(--tx);font-size:20px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);z-index:8}
.bar .btn{max-width:532px;display:block;margin:0 auto}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.f label{display:grid;gap:4px;font-size:14px;margin-bottom:10px;color:var(--mu)}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-weight:600}.msg:empty{display:none}
.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.big{font-size:20px;text-align:center;padding:16px}
.ticket{background:var(--card);border:1px solid var(--bd);border-radius:18px;text-align:center;margin-bottom:12px;overflow:hidden}
.ticket .top{background:var(--hi);color:#1a1203;padding:12px}
.no{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ticket .mid{padding:6px 16px 14px;border-top:2px dashed var(--bd);position:relative}
.qr{background:#fff;padding:10px;border-radius:12px;width:min(250px,80%);margin:12px auto 6px}.qr svg{width:100%;height:auto;display:block}
.steps{display:flex;gap:4px;margin:10px 0 2px;flex-wrap:wrap;justify-content:center}
.steps span{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--chip);color:var(--mu)}.steps .on{background:var(--ac);color:var(--act)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.tot{border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px;font-size:18px}
.pill{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.mu{color:var(--mu)}.sm{font-size:13px}.c{text-align:center}
.link{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;padding:0 0 8px;cursor:pointer}
video{width:100%;border-radius:12px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{display:grid;text-align:center;margin:0;font-size:22px}
.pi{width:84px;padding:7px}
</style>
</head>
<body>
<header><span class="brand">PickupQR</span>
<nav><button data-v="cust" onclick="go('cust')">Customer</button><button data-v="staff" onclick="go('staff')">Staff</button><button data-v="admin" onclick="go('admin')">Admin</button></nav></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $=s=>document.querySelector(s),K='pq_v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed={n:1000,p:[
{id:1,c:'Food',n:'Veg sandwich',pr:80,e:'🥪',on:1},{id:2,c:'Food',n:'Masala dosa',pr:120,e:'🥞',on:1},{id:3,c:'Food',n:'Paneer roll',pr:110,e:'🌯',on:1},
{id:4,c:'Drinks',n:'Masala chai',pr:25,e:'☕',on:1},{id:5,c:'Drinks',n:'Cold coffee',pr:90,e:'🧋',on:1},{id:6,c:'Drinks',n:'Fresh lime',pr:40,e:'🍋',on:1},
{id:7,c:'Grocery',n:'Milk 1 L',pr:56,e:'🥛',on:1},{id:8,c:'Grocery',n:'Bread loaf',pr:45,e:'🍞',on:1},{id:9,c:'Grocery',n:'Eggs (6)',pr:48,e:'🥚',on:1}],o:[]};
let S=JSON.parse(JSON.stringify(seed)),view='cust',page='menu',cat='All',cart={},cur=null,staffIn=false,stream=null;
const load=()=>{try{const s=JSON.parse(localStorage.getItem(K));if(s)S=s}catch(e){}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const mine=()=>{try{return JSON.parse(localStorage.getItem('pq_mine'))||[]}catch(e){return[]}};
const addMine=t=>{try{localStorage.setItem('pq_mine',JSON.stringify([t,...mine()]))}catch(e){}};
const P=id=>S.p.find(p=>p.id===id),F=t=>S.o.find(o=>o.t===t);
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0),sub=()=>Object.entries(cart).reduce((a,[i,q])=>a+P(+i).pr*q,0);
const er=m=>{const e=$('#er');if(e)e.textContent=m};
const open=o=>!['Picked Up','Cancelled'].includes(o.st);
function add(i,d){const q=(cart[i]||0)+d;q>0?cart[i]=q:delete cart[i];R()}
function go(v){view=v;stop();R()}
function R(){load();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
$('#app').innerHTML=view==='cust'?cust():!staffIn?login():view==='staff'?staff():admin()}

/* CUSTOMER (guest, no account) */
function cust(){
 if(page==='order')return orderView();
 if(page==='cart'&&cnt())return cartView();
 page='menu';
 const cats=['All',...new Set(S.p.map(p=>p.c))],n=cnt();
 return `<h2>What would you like to pick up?</h2>
 <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';R()">${c}</button>`).join('')}</div>
 <div class="grid">${S.p.filter(p=>cat==='All'||p.c===cat).map(p=>{const q=cart[p.id]||0;
 return `<div class="card pr ${p.on?'':'off'}"><div class="em">${p.e}</div><b>${p.n}</b><span class="mu">₹${p.pr}${p.on?'':' · Sold out'}</span>${p.on?(q?`<div class="qty"><button aria-label="Remove one" onclick="add(${p.id},-1)">−</button><b>${q}</b><button aria-label="Add one" onclick="add(${p.id},1)">+</button></div>`:`<button class="btn sm" onclick="add(${p.id},1)">Add</button>`):''}</div>`}).join('')}</div>
 ${myOrders()}
 ${n?`<div class="bar"><button class="btn" onclick="page='cart';R()">View cart · ${n} item${n>1?'s':''} · ₹${sub()}</button></div>`:''}`}
function myOrders(){const l=mine().map(F).filter(Boolean);if(!l.length)return'';
 return `<h3>Your orders on this device</h3>${l.map(o=>`<button class="card row" onclick="cur='${o.t}';page='order';R()"><span><b>${o.no}</b> · ₹${o.total}</span><span class="pill">${o.st}</span></button>`).join('')}<p class="mu sm">Clearing your browser data removes this list.</p>`}
function cartView(){const s=sub(),tx=Math.round(s*.05);
 return `<button class="link" onclick="page='menu';R()">← Back to menu</button><h2>Your cart</h2>
 <div class="card">${Object.entries(cart).map(([i,q])=>{const p=P(+i);return `<div class="row"><span>${p.e} ${p.n} × ${q}</span><b>₹${p.pr*q}</b></div>`}).join('')}
 <div class="row mu"><span>Tax (5%)</span><span>₹${tx}</span></div><div class="row tot"><span>Total</span><b>₹${s+tx}</b></div></div>
 <div class="card f"><label>Name, so staff can call it out<input id="nm" autocomplete="given-name"></label>
 <label>Phone, optional, for “order ready” alerts<input id="ph" inputmode="tel"></label>
 <label>Pickup time<select id="sl"><option>ASAP</option><option>In 15 min</option><option>In 30 min</option><option>In 1 hour</option></select></label>
 <label>Payment<select id="py"><option value="store">Pay at store</option><option value="online">Pay online (demo)</option></select></label>
 <p class="mu sm">No account needed. We keep your name and phone only to run this order.</p>
 <div id="er" class="msg bad"></div><button class="btn" onclick="place()">Place order and get QR</button></div>`}
function place(){load();
 const name=$('#nm').value.trim(),ph=$('#ph').value.trim(),pay=$('#py').value,slot=$('#sl').value;
 const items=Object.entries(cart).map(([i,q])=>({p:P(+i),q}));
 const act=mine().map(F).filter(o=>o&&open(o)).length;
 if(!name)return er('Enter your name so staff can find your order.');
 if(act>=3)return er('You already have 3 active orders. Collect one before placing another.');
 if(items.some(x=>!x.p.on))return er('An item just sold out. Go back to the menu and remove it.');
 const s=items.reduce((a,x)=>a+x.p.pr*x.q,0),tx=Math.round(s*.05);
 const t=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
 S.o.unshift({t,no:'#A-'+(++S.n),name,ph,pay,slot,paid:pay==='online',items:items.map(x=>({n:x.p.n,e:x.p.e,pr:x.p.pr,q:x.q})),total:s+tx,st:'Placed',ts:Date.now(),used:0});
 save();addMine(t);cart={};cur=t;page='order';R()}
function qr(t){if(typeof qrcode==='undefined')return`<code>${t}</code>`;const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag(5,2)}
function orderView(){const o=F(cur);if(!o){page='menu';return cust()}
 const st=['Placed','Accepted','Preparing','Ready','Picked Up'],i=st.indexOf(o.st);
 const code=o.st==='Picked Up'?'<div class="msg ok big">Picked up ✓</div>':o.st==='Cancelled'?'<div class="msg bad big">Order cancelled</div>':
 `${o.st==='Ready'?'<div class="msg ok">Your order is ready. Show this code at the counter.</div>':''}<div class="qr">${qr(o.t)}</div><p class="mu sm">Staff scan this code to hand over your order.</p>`;
 return `<button class="link" onclick="page='menu';R()">← Back to menu</button>
 <div class="ticket"><div class="top"><div class="no">${o.no}</div>${esc(o.name)} · ${o.slot}</div><div class="mid">${code}
 <div class="steps">${st.map((x,j)=>`<span class="${o.st!=='Cancelled'&&j<=i?'on':''}">${x}</span>`).join('')}</div></div></div>
 <div class="card">${o.items.map(x=>`<div class="row"><span>${x.e} ${x.n} × ${x.q}</span><b>₹${x.pr*x.q}</b></div>`).join('')}<div class="row tot"><span>${o.paid?'Paid':'Pay at counter'}</span><b>₹${o.total}</b></div></div>
 ${['Placed','Accepted'].includes(o.st)?`<button class="btn ghost" onclick="cancel('${o.t}')">Cancel order</button>`:''}
 <p class="mu sm c">Screenshot your code. Staff can also find your order by number or name.</p>`}
function cancel(t){load();const o=F(t);if(o&&['Placed','Accepted'].includes(o.st)){o.st='Cancelled';save()}R()}

/* STAFF */
function login(){return `<div class="card f"><h2>Staff sign-in</h2><p class="mu sm">Demo PIN: 1234</p><label>PIN<input id="pin" type="password" inputmode="numeric"></label><div id="er" class="msg bad"></div><button class="btn" onclick="signin()">Sign in</button></div>`}
function signin(){if($('#pin').value==='1234'){staffIn=true;R()}else er('Wrong PIN. Try again.')}
function staff(){return `<div class="card f"><h2>Scan pickup code</h2><video id="vid" playsinline muted hidden></video>
 <button class="btn" onclick="cam()">Open camera scanner</button>
 <div class="row2"><input id="lk" placeholder="Order number, name or phone" aria-label="Manual lookup"><button class="btn sm" onclick="look()">Find</button></div></div>
 <div id="res"></div><h3>Live queue</h3><div id="q">${queue()}</div>`}
async function cam(){const v=$('#vid');
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.hidden=false;await v.play();tick()}
 catch(e){stop();$('#res').innerHTML='<div class="msg bad">Camera is not available here. Use the lookup box instead.</div>'}}
function tick(){const v=$('#vid');if(!v||!stream)return;
 if(v.readyState===4&&window.jsQR){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0);
 const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r&&r.data){stop();load();show(F(r.data));return}}
 requestAnimationFrame(tick)}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const v=$('#vid');if(v)v.hidden=true}
function look(){load();const v=$('#lk').value.trim().toLowerCase();
 show(v&&S.o.find(o=>o.no.toLowerCase()===v||o.no.toLowerCase()==='#a-'+v||o.name.toLowerCase().includes(v)||(o.ph&&o.ph.includes(v))))}
function show(o){const r=$('#res');if(!o){r.innerHTML='<div class="msg bad big">✗ Invalid code</div>';return}
 let m='';if(o.st==='Cancelled')m='✗ Order was cancelled';
 else if(o.used)m='✗ Already picked up at '+new Date(o.used).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 else if(Date.now()-o.ts>864e5)m='✗ Order expired';
 r.innerHTML=`<div class="msg ${m?'bad':'ok'} big">${m||'✓ Valid order'}</div><div class="card"><b>${o.no} · ${esc(o.name)}</b> <span class="mu">${esc(o.ph||'')}</span>
 ${o.items.map(x=>`<div class="row"><span>${x.e} ${x.n} × ${x.q}</span><b>₹${x.pr*x.q}</b></div>`).join('')}
 <div class="row tot"><span>${o.paid?'Paid':'Collect at counter'}</span><b>₹${o.total}</b></div>
 ${m?'':`<button class="btn" onclick="hand('${o.t}')">${o.paid?'':'Collect ₹'+o.total+' and '}confirm handover</button>`}</div>`}
function hand(t){load();const o=F(t);
 if(o&&!o.used&&o.st!=='Cancelled'){o.used=Date.now();o.st='Picked Up';o.paid=true;save();$('#res').innerHTML='<div class="msg ok big">✓ Handed over</div>'}
 else show(o);$('#q').innerHTML=queue()}
function queue(){load();const l=S.o.filter(open),nx={Placed:'Accept',Accepted:'Start preparing',Preparing:'Mark ready'};
 if(!l.length)return'<p class="mu">No active orders. Place one from the Customer tab.</p>';
 return l.map(o=>`<div class="card"><div class="row"><b>${o.no} · ${esc(o.name)}</b><span class="pill">${o.st}</span></div>
 <div class="mu sm">${o.items.map(x=>x.q+'× '+x.n).join(', ')} · ₹${o.total} · ${o.paid?'Paid':'Pay at counter'} · ${o.slot}</div>
 <div class="row2">${nx[o.st]?`<button class="btn sm" onclick="adv('${o.t}')">${nx[o.st]}</button>`:'<span class="mu sm">Waiting for the customer’s code</span>'}${o.st==='Placed'?`<button class="btn sm ghost" onclick="adv('${o.t}',1)">Reject</button>`:''}</div></div>`).join('')}
function adv(t,rej){load();const o=F(t),f=['Placed','Accepted','Preparing','Ready'];if(o){o.st=rej?'Cancelled':f[f.indexOf(o.st)+1];save()}$('#q').innerHTML=queue()}

/* ADMIN */
function admin(){const d=new Date().toDateString(),td=S.o.filter(o=>new Date(o.ts).toDateString()===d);
 return `<h2>Today</h2><div class="stats"><div class="card"><b>${td.length}</b><span class="mu sm">Orders</span></div><div class="card"><b>₹${td.filter(o=>o.st==='Picked Up').reduce((a,o)=>a+o.total,0)}</b><span class="mu sm">Collected</span></div><div class="card"><b>${td.filter(open).length}</b><span class="mu sm">Pending</span></div></div>
 <h3>Products</h3>${S.p.map(p=>`<div class="card row"><span>${p.e} ${p.n}</span><span class="row2" style="margin:0"><input class="pi" type="number" min="0" value="${p.pr}" aria-label="Price of ${p.n}" onchange="setp(${p.id},this.value)"><button class="btn sm ${p.on?'':'ghost'}" onclick="tog(${p.id})">${p.on?'Available':'Sold out'}</button></span></div>`).join('')}
 <button class="btn ghost" onclick="reset()">Reset demo data</button>`}
function setp(i,v){load();P(i).pr=Math.max(0,+v||0);save()}
function tog(i){load();P(i).on=P(i).on?0:1;save();R()}
function reset(){S=JSON.parse(JSON.stringify(seed));save();cart={};try{localStorage.removeItem('pq_mine')}catch(e){}R()}

const live=()=>{if(view==='cust'&&page==='order')R();else if(view==='staff'&&staffIn&&$('#q'))$('#q').innerHTML=queue()};
setInterval(live,2500);addEventListener('storage',live);R();
</script>
</body>
</html>
