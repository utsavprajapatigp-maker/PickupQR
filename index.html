<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Counter Pass</title>
<meta name="theme-color" content="#0F5132"><link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
<style type="text/tailwindcss">
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;@apply bg-slate-50 text-slate-900}
.btn{@apply px-4 py-2.5 rounded-lg font-semibold bg-[#0F5132] text-white active:scale-95 disabled:opacity-40}
.btn2{@apply px-3 py-2 rounded-lg font-semibold bg-white border border-slate-300 disabled:opacity-40}
.in{@apply w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white}
.card{@apply bg-white rounded-xl border border-slate-200 p-3}
@media print{#app{display:none!important}#poster{display:block!important}}
</style></head><body><div id="app"></div><div id="poster" class="hidden"></div>
<script>
/* ===== FIREBASE (optional multi-device sync) =====
   Paste your web-app config below, e.g. {apiKey:"..",authDomain:"..",projectId:"..",appId:".."}
   and enable Firestore. Leave null to use localStorage (single device / same browser).
   NOTE: lock down Firestore rules in production; client-only checks cannot stop a determined attacker. */
const FIREBASE_CONFIG=null;

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));
const hmac=async(k,m)=>hex(await crypto.subtle.sign('HMAC',await crypto.subtle.importKey('raw',enc.encode(k),{name:'HMAC',hash:'SHA-256'},false,['sign']),enc.encode(m)));
const rnd=n=>hex(crypto.getRandomValues(new Uint8Array(n)));
const strong=p=>/^\d{6}$/.test(p)&&!/^(\d)\1{5}$/.test(p)&&!/^(\d\d)\1\1$/.test(p)&&!/^(\d{3})\1$/.test(p)&&!'01234567890'.includes(p)&&!'09876543210'.includes(p);

/* ===== Data layer: Firestore if configured, else localStorage (+ cross-tab sync) ===== */
const S={products:{},orders:{},settings:{},audit:{}},subs=[];let fb=null;
const LS=c=>JSON.parse(localStorage.getItem('pos_'+c)||'{}'),changed=()=>subs.forEach(f=>f());
async function initDB(){
 if(FIREBASE_CONFIG){try{const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),F=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const db=F.getFirestore(A.initializeApp(FIREBASE_CONFIG));fb={F,db};
  for(const c in S)F.onSnapshot(F.collection(db,c),sn=>{S[c]={};sn.forEach(d=>S[c][d.id]=d.data());changed()});return}catch(e){console.warn('Firebase failed; using localStorage',e)}}
 for(const c in S)S[c]=LS(c);addEventListener('storage',()=>{for(const c in S)S[c]=LS(c);changed()})}
const persist=c=>localStorage.setItem('pos_'+c,JSON.stringify(S[c]));
const put=(c,o)=>{S[c][o.id]=o;fb?fb.F.setDoc(fb.F.doc(fb.db,c,o.id),o):persist(c);changed()};
const del=(c,id)=>{delete S[c][id];fb?fb.F.deleteDoc(fb.F.doc(fb.db,c,id)):persist(c);changed()};
const cfg=()=>S.settings.main||{name:'Corner Mart & Grill',upi:'',hash:'',lock:15,salt:'',hkey:''};
const seed=()=>{if(S.settings.main)return;put('settings',{id:'main',name:'Corner Mart & Grill',upi:'',salt:rnd(16),hkey:rnd(32),hash:'',lock:15});
 [['Masala Fries',89,'ff','🍟'],['Chicken Burger',149,'ff','🍔'],['Paneer Wrap',129,'ff','🌯'],['Cold Coffee',79,'ff','🥤'],['Basmati Rice 1kg',129,'sp','🍚'],['Atta 5kg',249,'sp','🌾'],['Butter 100g',58,'sp','🧈'],['Tea Powder 250g',120,'sp','🍵']].forEach(([n,p,c,e])=>put('products',{id:'p'+rnd(3),n,p,c,e,ok:1}))};
async function log(ev){const l=Object.values(S.audit).sort((a,b)=>b.t-a.t)[0],e={id:Date.now()+rnd(2),t:Date.now(),ev,prev:l?.h||'0'};e.h=await sha(e.prev+e.t+ev);put('audit',e)} // hash-chained, append-only

/* ===== State ===== */
let panel=new URLSearchParams(location.search).get('panel')=='admin'?'admin':'user',tab='all',q='',cart={},drawer='',co={name:'',arr:'Arriving now',pay:'counter'},taps=[];
let un=false,at='orders',ent='',p1='',msg='',last=Date.now(),edit='',scanRes=null,scanMsg='',scn=null,busy=0,seen=new Set(),seenInit=false,wl=0;
const dev=localStorage.pos_dev||(localStorage.pos_dev=rnd(8)),ST=['Order received','Preparing','Ready for pickup','Handed over'];
const cartTotal=()=>Object.entries(cart).reduce((a,[id,n])=>a+(S.products[id]?.p||0)*n,0);
const mine=()=>JSON.parse(localStorage.pos_mine||'[]').map(i=>S.orders[i]).filter(Boolean).sort((a,b)=>b.t-a.t);
function toast(m){const t=document.createElement('div');t.textContent=m;t.className='fixed top-3 inset-x-3 z-50 mx-auto max-w-sm bg-slate-900 text-white rounded-lg p-3 text-center';document.body.append(t);setTimeout(()=>t.remove(),2800)}
function chime(){try{const a=new(window.AudioContext||webkitAudioContext)(),t=a.currentTime;[880,1175].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,t+i*.18);g.gain.exponentialRampToValueAtTime(.001,t+i*.18+.45);o.start(t+i*.18);o.stop(t+i*.18+.45)})}catch{}}

/* ===== Shared order views ===== */
const tracker=o=>`<ol class="flex justify-between my-3 text-center text-xs gap-1">${ST.map((s,i)=>`<li class="flex-1"><div class="mx-auto mb-1 w-6 h-6 rounded-full grid place-items-center ${i<=o.st?'bg-[#0F5132] text-white':'bg-slate-200'}">${i<=o.st?'✓':''}</div>${s}</li>`).join('')}</ol>`;
const lines=(o,c)=>o.items.filter(i=>i.c==c).map(i=>`<li class="flex gap-2"><input type="checkbox" class="mt-1">${i.q}× ${esc(i.n)}</li>`).join('');
const orderCard=o=>o?`<div class="card mb-3 ${o.st==3?'opacity-60':''}"><div class="flex items-center gap-2"><b class="text-2xl tracking-widest">${o.pin}</b><span>${esc(o.name)}</span><span class="ml-auto text-sm">${esc(o.arr)} · ₹${o.amt}</span></div>
<div class="text-sm my-1"><span class="px-2 rounded ${o.paid?'bg-green-100 text-green-800':'bg-amber-100 text-amber-800'}">${o.paid?'Paid':o.pay=='online'?'Online – verify payment':'Pay at counter'}</span> <span class="px-2 rounded bg-slate-100">${ST[o.st]}</span></div>
${['ff','sp'].map(c=>lines(o,c)?`<h4 class="font-semibold mt-2">${c=='ff'?'Kitchen prep':'Store shelf packing'}</h4><ul class="text-sm">${lines(o,c)}</ul>`:'').join('')}
${o.st<3?`<div class="flex gap-2 mt-3">${o.paid?'':`<button class="btn2" onclick="paid('${o.id}')">Mark paid</button>`}<button class="btn flex-1" onclick="adv('${o.id}')">${['Start preparing','Mark ready','Hand over'][o.st]}</button></div>`:''}</div>`:'';

/* ===== Customer panel ===== */
function userView(){const c=cfg(),list=Object.values(S.products).filter(p=>(tab=='all'||p.c==tab)&&p.n.toLowerCase().includes(q.toLowerCase())),n=Object.values(cart).reduce((a,b)=>a+b,0),ao=mine().find(o=>o.st<3);
 return `<header class="sticky top-0 z-10 bg-[#0F5132] text-white p-3 flex items-center gap-3"><div class="font-extrabold text-xl select-none" onclick="tap()">${esc(c.name)}</div><button class="btn2 !bg-transparent !text-white !border-white/40 ml-auto text-sm" onclick="drawer='mine';render()">My passes</button></header>
<main class="p-3 max-w-3xl mx-auto pb-28">${ao?`<button class="w-full text-left card mb-3 !border-2 !border-[#F5A524]" onclick="drawer='pass:${ao.id}';render()"><b>Order ${ao.pin}</b> · ${ST[ao.st]}<br><span class="text-sm text-slate-500">Tap to show your pass</span></button>`:''}
<input id="q" class="in mb-3" placeholder="Search kitchen menu and shelves" value="${esc(q)}" oninput="q=this.value;render()">
<div class="flex gap-2 mb-3 overflow-x-auto">${[['all','All'],['ff','Fast food'],['sp','Store products']].map(([k,l])=>`<button class="btn2 whitespace-nowrap ${tab==k?'!bg-[#F5A524] !border-[#F5A524]':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${list.map(p=>`<div class="card ${p.ok?'':'opacity-50'}"><div class="text-4xl">${esc(p.e)}</div><div class="font-semibold leading-tight mt-1">${esc(p.n)}</div><div class="text-xs text-slate-500">${p.c=='ff'?'Made fresh in the kitchen':'Packed from the shelf'}</div><div class="flex items-center mt-2"><b class="flex-1">₹${p.p}</b>${!p.ok?'<span class="text-xs font-bold text-red-600">Sold out</span>':cart[p.id]?`<button class="btn2" onclick="add('${p.id}',-1)">−</button><b class="px-2">${cart[p.id]}</b><button class="btn2" onclick="add('${p.id}',1)">+</button>`:`<button class="btn !py-1.5" onclick="add('${p.id}',1)">Add</button>`}</div></div>`).join('')||'<p class="col-span-full text-slate-500">Nothing matches. Try another word.</p>'}</div>
<p class="text-center text-xs text-slate-400 mt-8"><a href="?panel=admin">Store Staff Login</a></p></main>
${n?`<button class="btn fixed bottom-3 inset-x-3 py-4 flex justify-between z-10" onclick="drawer='cart';render()"><span><i data-lucide="shopping-bag" class="inline w-5 h-5"></i> ${n} items</span><span>View order · ₹${cartTotal()}</span></button>`:''}${drawerView()}`}
function tap(){taps=taps.filter(t=>Date.now()-t<800);taps.push(Date.now());if(taps.length>=3)location.search='?panel=admin'}
function add(id,d){cart[id]=Math.min(20,Math.max(0,(cart[id]||0)+d));if(!cart[id])delete cart[id];if(!Object.keys(cart).length&&drawer=='cart')drawer='';render()}
function drawerView(){if(!drawer)return'';let h='';
 if(drawer=='cart')h=`<h2 class="font-extrabold text-lg mb-2">Your order</h2>${Object.entries(cart).map(([id,n])=>{const p=S.products[id];return p?`<div class="flex items-center gap-2 py-1"><span class="flex-1">${esc(p.n)}</span><button class="btn2" onclick="add('${id}',-1)">−</button><b>${n}</b><button class="btn2" onclick="add('${id}',1)">+</button><span class="w-16 text-right">₹${p.p*n}</span></div>`:''}).join('')}
<input id="nm" class="in my-3" placeholder="Your name" maxlength="40" value="${esc(co.name)}" onchange="co.name=this.value">
<p class="font-semibold">When will you arrive?</p><div class="flex gap-2 my-2 flex-wrap">${['Arriving now','In 15 mins','In 30 mins'].map(a=>`<button class="btn2 ${co.arr==a?'!bg-[#F5A524]':''}" onclick="co.arr='${a}';render()">${a}</button>`).join('')}</div>
<p class="font-semibold">Payment</p><div class="flex gap-2 my-2">${[['online','Pay online (UPI)'],['counter','Pay at counter']].map(([k,l])=>`<button class="btn2 ${co.pay==k?'!bg-[#F5A524]':''}" onclick="co.pay='${k}';render()">${l}</button>`).join('')}</div>
<button class="btn w-full mt-2" onclick="place()">Place order · ₹${cartTotal()}</button>`;
 else if(drawer=='mine')h=`<h2 class="font-extrabold text-lg mb-2">My passes</h2>${mine().map(o=>`<button class="card w-full text-left mb-2" onclick="drawer='pass:${o.id}';render()"><b>${o.pin}</b> · ₹${o.amt} · ${ST[o.st]}</button>`).join('')||'<p class="text-slate-500">No passes on this device yet. Place an order to get one.</p>'}`;
 else{const o=S.orders[drawer.slice(5)],c=cfg();h=!o?'<p>Pass not found.</p>':`<div class="text-center"><p class="text-sm text-slate-500">${esc(c.name)} pickup pass</p><div id="qr" class="inline-block p-2 border rounded-lg my-2" data-q="${esc(JSON.stringify({v:1,id:o.id,pin:o.pin,amt:o.amt,pay:o.pay,sig:o.sig}))}"></div><p class="text-xs text-slate-500">Pickup PIN</p><p class="text-4xl font-extrabold tracking-[.3em]">${o.pin}</p><p class="text-sm">${esc(o.arr)} · ₹${o.amt} · ${o.paid?'Paid':o.pay=='online'?'Payment pending':'Pay at counter'}</p></div>${tracker(o)}
${['ff','sp'].map(k=>{const l=o.items.filter(i=>i.c==k);return l.length?`<h4 class="font-semibold mt-2">${k=='ff'?'[KITCHEN]':'[STORE]'}</h4><ul class="text-sm">${l.map(i=>`<li>${i.q}× ${esc(i.n)} <span class="float-right">₹${i.p*i.q}</span></li>`).join('')}</ul>`:''}).join('')}
${o.pay=='online'&&!o.paid&&c.upi?`<a class="btn block text-center mt-3" href="upi://pay?pa=${encodeURIComponent(c.upi)}&pn=${encodeURIComponent(c.name)}&am=${o.amt}&cu=INR&tn=${o.id}">Pay ₹${o.amt} in your UPI app</a><div id="upiqr" class="mt-2 flex justify-center" data-q="${esc(`upi://pay?pa=${encodeURIComponent(c.upi)}&pn=${encodeURIComponent(c.name)}&am=${o.amt}&cu=INR&tn=${o.id}`)}"></div>`:o.pay=='online'&&!o.paid?'<p class="text-sm text-amber-700 mt-2">Store UPI is not set up yet. Pay at the counter.</p>':''}`}
 return `<div class="fixed inset-0 z-20 bg-black/50 flex items-end sm:items-center justify-center" onclick="if(event.target==this){drawer='';render()}"><div class="bg-white w-full max-w-md max-h-[90vh] overflow-auto rounded-t-2xl sm:rounded-2xl p-4">${h}<button class="btn2 w-full mt-3" onclick="drawer='';render()">Close</button></div></div>`}
async function place(){co.name=$('#nm')?.value??co.name;const m=JSON.parse(localStorage.pos_mine||'[]');
 if(Date.now()-(+localStorage.pos_last||0)<2e4)return toast('Please wait 20 seconds between orders.');
 if(m.map(i=>S.orders[i]).filter(o=>o&&o.st<3).length>=3)return toast('You already have 3 active orders. Collect one first.');
 const items=Object.entries(cart).map(([id,n])=>{const p=S.products[id];return p&&p.ok?{id,n:p.n,p:p.p,c:p.c,q:n}:null}).filter(Boolean); // prices always from catalog
 if(!items.length)return toast('Those items are no longer available.');
 const amt=items.reduce((a,i)=>a+i.p*i.q,0),id='o'+rnd(4).toUpperCase(),c=cfg();let pin;
 do pin=String(1000+crypto.getRandomValues(new Uint32Array(1))[0]%9000);while(Object.values(S.orders).some(x=>x.pin==pin&&x.st<3));
 const o={id,dev,name:co.name.trim().slice(0,40)||'Guest',items,amt,pay:co.pay,paid:0,arr:co.arr,st:0,pin,t:Date.now(),sig:await hmac(c.hkey||'x',`${id}|${pin}|${amt}|${co.pay}`)};
 put('orders',o);m.push(id);localStorage.pos_mine=JSON.stringify(m);localStorage.pos_last=Date.now();cart={};drawer='pass:'+id;render()}

/* ===== Admin panel ===== */
const lockLeft=()=>Math.max(0,Math.ceil(((+localStorage.pos_lock||0)-Date.now())/1e3));
function loginView(){const c=cfg(),lk=lockLeft(),setup=!c.hash;
 return `<div class="min-h-screen grid place-items-center bg-[#0F5132] p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center"><h1 class="font-extrabold text-xl">${setup?(p1?'Confirm your PIN':'Create a 6-digit admin PIN'):'Enter admin PIN'}</h1>
<div class="flex justify-center gap-2 my-4">${[0,1,2,3,4,5].map(i=>`<i class="w-3.5 h-3.5 rounded-full ${i<ent.length?'bg-[#0F5132]':'bg-slate-200'}"></i>`).join('')}</div>
<p class="text-sm text-red-600 min-h-5">${lk?`Too many attempts. Try again in ${lk}s.`:esc(msg)}</p>
<div class="grid grid-cols-3 gap-2 mt-2">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button class="btn2 py-3 text-lg" ${lk?'disabled':''} onclick="key('${k}')">${k}</button>`).join('')}</div><a href="?panel=user" class="block mt-4 text-xs text-slate-400">Back to storefront</a></div></div>`}
async function key(k){if(lockLeft())return;if(k=='⌫')ent=ent.slice(0,-1);else if(k=='C')ent='';else if(ent.length<6)ent+=k;msg='';
 if(ent.length==6){const c=cfg(),e=ent;ent='';
  if(!c.hash){if(!p1){if(strong(e))p1=e;else msg='Too easy to guess. Avoid repeats and sequences.'}else if(p1!=e){msg='PINs did not match. Start again.';p1=''}else{const salt=rnd(16);put('settings',{...c,id:'main',salt,hash:await sha(salt+e)});p1='';log('Admin PIN created');return unlock()}}
  else if(await sha(c.salt+e)==c.hash){localStorage.pos_fails=0;log('Admin login');return unlock()}
  else{const f=(+localStorage.pos_fails||0)+1;localStorage.pos_fails=f;msg='Wrong PIN.';log('Failed login attempt '+f);if(f>=5){localStorage.pos_lock=Date.now()+6e4;localStorage.pos_fails=0;log('Keypad locked for 60s')}}}
 render()}
function unlock(){un=true;last=Date.now();Object.keys(S.orders).forEach(i=>seen.add(i));seenInit=true;render()}
function lock(why){un=false;ent='';scn&&stopScan();log('Admin locked ('+why+')');render()}
const go=async k=>{if(scn)await stopScan();at=k;render()},paid=id=>{put('orders',{...S.orders[id],paid:1});log('Payment collected '+id)};
function adv(id){const o=S.orders[id];if(o.st==2&&!o.paid)return toast('Collect payment before handover.');put('orders',{...o,st:o.st+1});if(o.st==2)log('Handed over '+id)}
async function startScan(){try{scn=new Html5Qrcode('reader');$('#reader').classList.remove('hidden');await scn.start({facingMode:'environment'},{fps:10,qrbox:220},async t=>{if(busy)return;busy=1;await stopScan();await check(t);busy=0},()=>{});render()}catch(e){scn=null;scanMsg='Camera unavailable or blocked. Allow camera access in browser settings, or use PIN lookup.';render()}}
async function stopScan(){try{await scn?.stop()}catch{}scn=null;render()}
async function check(txt){let r;try{const d=JSON.parse(txt),o=S.orders[d.id],c=cfg();
 if(!o||d.v!==1)r={ok:0,m:'Unknown pass. No matching order.'};
 else if(d.sig!==await hmac(c.hkey||'x',`${d.id}|${d.pin}|${d.amt}|${d.pay}`)||d.sig!==o.sig||d.pin!==o.pin||d.amt!==o.amt||d.pay!==o.pay){r={ok:0,m:'TAMPERED QR. Signature does not match this order.'};log('Tampered QR scanned for '+d.id)}
 else if(o.st==3){r={ok:0,m:'Already handed over. Duplicate scan blocked.',id:o.id};log('Replay blocked '+o.id)}
 else r={ok:1,m:'Valid pass. Signature verified.',id:o.id}}catch{r={ok:0,m:'Not a Counter Pass QR code.'}}
 scanRes=r;scanMsg='';render()}
function byPin(){const p=$('#pin').value.trim(),o=Object.values(S.orders).filter(x=>x.pin==p).sort((a,b)=>(a.st==3)-(b.st==3)||b.t-a.t)[0];scanRes=!o?{ok:0,m:'No order with that PIN.'}:o.st==3?{ok:0,m:'Already handed over.',id:o.id}:{ok:1,m:'Order found.',id:o.id};render()}
function saveP(){const n=$('#pn').value.trim().slice(0,50),p=Math.round(+$('#pp').value*100)/100;if(!n||!(p>0&&p<=1e5))return toast('Enter a name and a price between 1 and 100000.');
 const o=S.products[edit]||{id:'p'+rnd(3),ok:1};put('products',{...o,n,p,c:$('#pc').value,e:$('#pe').value.trim()||'🛒'});log((edit?'Edited ':'Added ')+n);edit=''}
const stock=id=>put('products',{...S.products[id],ok:S.products[id].ok?0:1}),delP=id=>{if(confirm('Delete this item?')){del('products',id);log('Deleted item '+id)}};
const saveS=()=>{put('settings',{...cfg(),id:'main',name:$('#sn').value.trim().slice(0,40)||'Store',upi:$('#su').value.trim().slice(0,60)});log('Store settings saved');toast('Saved')};
const setLock=m=>{put('settings',{...cfg(),id:'main',lock:+m});log('Auto-lock set to '+m+' min')};
async function chPin(){const c=cfg(),o=$('#op').value,n=$('#np').value;if(await sha(c.salt+o)!=c.hash)return toast('Current PIN is wrong.');if(!strong(n))return toast('Use 6 digits, no repeats or sequences like 123456.');if(n!=$('#cp').value)return toast('New PINs do not match.');
 const salt=rnd(16);put('settings',{...c,id:'main',salt,hash:await sha(salt+n)});log('Admin PIN rotated');toast('PIN updated')}
function poster(){const c=cfg();$('#poster').innerHTML=`<div style="text-align:center;font-family:sans-serif;padding:40px"><h1 style="font-size:44px;margin:0">${esc(c.name)}</h1><p style="font-size:24px">Order ahead. Skip the queue.</p><div id="pq" style="display:inline-block;margin:24px"></div><p style="font-size:20px">Scan with your phone camera, order, then show your pass at the counter.</p></div>`;new QRCode($('#pq'),{text:location.origin+location.pathname+'?panel=user',width:320,height:320});setTimeout(()=>print(),300)}
function adminView(){if(!un)return loginView();const tabs=[['orders','Orders'],['scan','Scanner'],['menu','Menu'],['store','Store & QR'],['sec','Security']],os=Object.values(S.orders).sort((a,b)=>(a.st==3)-(b.st==3)||b.t-a.t),c=cfg();let h='';
 if(at=='orders')h=os.map(orderCard).join('')||'<p class="text-slate-500">No orders yet. New ones appear here with a chime.</p>';
 if(at=='scan')h=`<div id="reader" class="w-full max-w-sm mx-auto ${scn?'':'hidden'}"></div>${scanMsg?`<p class="text-red-600 my-2">${esc(scanMsg)}</p>`:''}<button class="btn w-full my-2" onclick="${scn?'stopScan()':'startScan()'}">${scn?'Stop camera':'Scan customer QR'}</button><div class="flex gap-2 my-2"><input id="pin" class="in" inputmode="numeric" maxlength="4" placeholder="4-digit pickup PIN"><button class="btn" onclick="byPin()">Find</button></div>${scanRes?`<div class="p-3 rounded-lg my-2 text-white font-semibold ${scanRes.ok?'bg-green-700':'bg-red-600'}">${esc(scanRes.m)}</div>${orderCard(S.orders[scanRes.id])}`:''}`;
 if(at=='menu'){const e=S.products[edit]||{};h=`<div class="card mb-3 grid grid-cols-2 gap-2"><input id="pn" class="in col-span-2" placeholder="Item name" maxlength="50" value="${esc(e.n)}"><input id="pp" class="in" type="number" min="1" placeholder="Price ₹" value="${e.p??''}"><select id="pc" class="in"><option value="ff" ${e.c=='ff'?'selected':''}>Fast food</option><option value="sp" ${e.c=='sp'?'selected':''}>Store product</option></select><input id="pe" class="in" maxlength="4" placeholder="Emoji" value="${esc(e.e||'')}"><button class="btn" onclick="saveP()">${edit?'Save changes':'Add item'}</button></div>`+Object.values(S.products).map(p=>`<div class="card mb-2 flex items-center gap-2"><span class="text-2xl">${esc(p.e)}</span><div class="flex-1"><b>${esc(p.n)}</b><div class="text-sm text-slate-500">${p.c=='ff'?'Fast food':'Store product'} · ₹${p.p}</div></div><button class="btn2 ${p.ok?'':'!bg-red-100'}" onclick="stock('${p.id}')">${p.ok?'In stock':'Sold out'}</button><button class="btn2" onclick="edit='${p.id}';render()">Edit</button><button class="btn2" onclick="delP('${p.id}')">Delete</button></div>`).join('')}
 if(at=='store'){const b=location.origin+location.pathname;h=`<div class="card grid gap-2"><input id="sn" class="in" maxlength="40" value="${esc(c.name)}" placeholder="Store name"><input id="su" class="in" maxlength="60" value="${esc(c.upi)}" placeholder="Store UPI ID (name@bank)"><button class="btn" onclick="saveS()">Save settings</button></div>${[['Customer link',b+'?panel=user'],['Admin link',b+'?panel=admin']].map(([l,u])=>`<div class="card mt-2"><b>${l}</b><div class="text-sm break-all">${esc(u)}</div><button class="btn2 mt-1" data-u="${esc(u)}" onclick="navigator.clipboard.writeText(this.dataset.u).then(()=>toast('Link copied'))">Copy link</button></div>`).join('')}<button class="btn w-full mt-3" onclick="poster()">Print entrance QR poster</button>`}
 if(at=='sec'){const au=Object.values(S.audit).sort((a,b)=>b.t-a.t).slice(0,50);h=`<div class="card grid gap-2"><b>Change admin PIN</b>${[['op','Current PIN'],['np','New 6-digit PIN'],['cp','Repeat new PIN']].map(([i,p])=>`<input id="${i}" class="in" type="password" inputmode="numeric" maxlength="6" placeholder="${p}">`).join('')}<button class="btn" onclick="chPin()">Update PIN</button></div><div class="card mt-2 flex items-center gap-2"><span class="flex-1">Auto-lock after</span><select class="in !w-auto" onchange="setLock(this.value)">${[5,15,30].map(m=>`<option value="${m}" ${c.lock==m?'selected':''}>${m} min</option>`).join('')}</select></div><div class="card mt-2"><b>Security log</b> <span class="text-xs text-slate-500">(append-only, hash-chained)</span>${au.map(a=>`<div class="text-xs py-1 border-b"><span class="text-slate-500">${new Date(a.t).toLocaleString()}</span> ${esc(a.ev)} <code class="text-slate-400">${a.h.slice(0,8)}</code></div>`).join('')}</div>`}
 return `<header class="sticky top-0 z-10 bg-[#0F5132] text-white p-3 flex items-center gap-2"><b class="flex-1">${esc(c.name)} POS</b><button class="btn2 !bg-transparent !text-white" onclick="lock('manual')"><i data-lucide="lock" class="inline w-4 h-4"></i> Lock POS</button></header><nav class="flex overflow-x-auto gap-2 p-2 bg-white border-b">${tabs.map(([k,l])=>`<button class="btn2 whitespace-nowrap ${at==k?'!bg-[#F5A524]':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main class="p-3 max-w-3xl mx-auto">${h}</main>`}

/* ===== Render / sync / boot ===== */
function render(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;$('#app').innerHTML=panel=='admin'?adminView():userView();window.lucide&&lucide.createIcons();
 if(id){const e=$('#'+id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch{}}}
 ['qr','upiqr'].forEach(i=>{const e=$('#'+i);if(e)new QRCode(e,{text:e.dataset.q,width:i=='qr'?176:140,height:i=='qr'?176:140})})}
function sync(){if(panel=='admin'&&un){const ids=Object.keys(S.orders);if(seenInit&&ids.some(i=>!seen.has(i)))chime();ids.forEach(i=>seen.add(i))}
 const a=document.activeElement;if(scn||(a&&/INPUT|SELECT/.test(a.tagName)&&a.id!='q'))return;render()}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>last=Date.now()));
setInterval(()=>{if(panel!='admin')return;if(un&&Date.now()-last>cfg().lock*6e4)lock('inactivity');else{const l=lockLeft();if(!un&&(l||wl))render();wl=l}},1000);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{await initDB();subs.push(sync);if(fb)await new Promise(r=>setTimeout(r,1500));seed();render()})();
</script></body></html>
